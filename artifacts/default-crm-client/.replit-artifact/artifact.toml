kind = "web"
previewPath = "/"
title = "CRM Client"
version = "1.0.0"
id = "artifacts/default-crm-client"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22085

[services.development]
run = "pnpm --filter @workspace/crm-client run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crm-client", "run", "build" ]
publicDir = "client/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22085"
SERVER_PORT = "3001"
